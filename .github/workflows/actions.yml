name: CEAC visa status check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # 每小时的 17 分跑一次（UTC）

permissions:
  contents: read
  actions: read   # 让内置 GITHUB_TOKEN 能读取/下载上一次的 status-artifact

concurrency:
  group: ceac-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment with uv
        run: uv sync

      # 取回上一次运行保存的状态，避免每小时都重复通知
      - name: Restore previous status record
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=status-artifact&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name status-artifact || echo "::warning::下载旧状态失败，本次按首次运行处理"
          else
            echo "没有找到历史状态，按首次运行处理"
          fi
          [ -f status_record.json ] || echo '{"statuses": []}' > status_record.json
          cat status_record.json

      - name: Execute py script
        env:
          LOCATION: ${{ secrets.LOCATION }}
          NUMBER: ${{ secrets.NUMBER }}
          PASSPORT_NUMBER: ${{ secrets.PASSPORT_NUMBER }}
          SURNAME: ${{ secrets.SURNAME }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          ACTIVE_HOURS: ${{ secrets.ACTIVE_HOURS }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP: ${{ secrets.SMTP }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 没有自建 PAT 时自动回退到本仓库的内置 token
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run trigger.py

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-artifact
          path: status_record.json
          retention-days: 90
